name: Docker ECR & ASG CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 저장소 소스코드 체크아웃
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # Step 2: AWS 자격 증명 구성
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # Step 3: Amazon ECR 프라이빗 레지스트리 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Docker 이미지 빌드 및 ECR 푸시
      - name: Build and push Docker image to ECR
        run: |
          docker build -t 925047940866.dkr.ecr.ap-northeast-2.amazonaws.com/std04/nginx:nginx1.31.3-ecr ./nginx
          docker build -t 925047940866.dkr.ecr.ap-northeast-2.amazonaws.com/std04/nginx:latest ./nginx

          docker push 925047940866.dkr.ecr.ap-northeast-2.amazonaws.com/std04/nginx:nginx1.31.3-ecr
          docker push 925047940866.dkr.ecr.ap-northeast-2.amazonaws.com/std04/nginx:latest

      # Step 5: S3로 설정 파일 및 웹 소스코드 전체(HTML/이미지 등) 전송
      - name: S3로 설정 파일 및 웹 소스코드 전송
        run: |
          aws s3 cp ./docker-compose.yaml s3://std04-state-bucket-2026/docker-compose.yaml
          # html 폴더 내의 모든 파일(이미지, CSS 등 포함)을 S3로 동기화
          aws s3 sync ./nginx/html/ s3://std04-state-bucket-2026/html/ --delete

      # Step 6: 프라이빗 인스턴스 컨테이너 배포
      - name: 프라이빗 인스턴스 컨테이너 배포
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Cicd,Values=asg" \
            --comment "Deploy custom Docker image and all web assets from S3" \
            --parameters 'commands=[
              "systemctl stop nginx || true",
              "mkdir -p /home/ec2-user/app",
              "mkdir -p /home/ec2-user/nginx/conf.d /home/ec2-user/nginx/html /home/ec2-user/nginx/logs",
              "[ -d /home/ec2-user/nginx/conf.d/default.conf ] && rm -rf /home/ec2-user/nginx/conf.d/default.conf || true",
              "echo \"server { listen 80; server_name localhost; location / { root /usr/share/nginx/html; index index.html; } }\" > /home/ec2-user/nginx/conf.d/default.conf",
              "aws s3 sync s3://std04-state-bucket-2026/html/ /home/ec2-user/nginx/html/ --delete",
              "cd /home/ec2-user/app",
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 925047940866.dkr.ecr.ap-northeast-2.amazonaws.com",
              "aws s3 cp s3://std04-state-bucket-2026/docker-compose.yaml ./docker-compose.yaml",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker image prune -f"
            ]' \
            --region ap-northeast-2