name: SSM CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-to-private:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 저장소 소스코드 체크아웃
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # Step 2: 빌드 가속 및 캐싱을 위한 Buildx 설정 (추천)
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # Step 3: Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Dockerfile 기반 이미지 빌드 및 푸시
      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jx7789/nginx:1.31.3-cd

      # Step 5: AWS 자격 증명 구성
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # Step 6: 프라이빗 인스턴스에 새 이미지 풀 및 컨테이너 기동 지시
      - name: 프라이빗 인스턴스 컨테이너 배포
        run: |
          aws ssm send-command \
            --instance-ids "i-039b3a150985ec04d" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy custom Docker image from Docker Hub" \
            --parameters 'commands=[
              "systemctl stop nginx || true",
              "docker pull jx7789/nginx:1.31.3-cd",
              "docker stop nginx-container || true",
              "docker rm nginx-container || true",
              "docker run -d --name nginx-container -p 80:80 jx7789/nginx:1.31.3-cd"
            ]' \
            --region ap-northeast-2